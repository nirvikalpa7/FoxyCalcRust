name: Rust Windows CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2

     Sir, для eframe/egui на Windows не нужны сторонние C-библиотеки,
     поэтому обычныйcargo build отработает идеально.
    - name: Build
      run: cargo build --verbose

    - name: Run tests
      run: cargo test --verbose

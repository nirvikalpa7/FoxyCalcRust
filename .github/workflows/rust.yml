name: Rust Windows CI/CD

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]          # релизный job будет реагировать на теги
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    # Это CI: собирает и тестирует каждый пуш/PR в main
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        # автоматически ключуется по Cargo.lock/Cargo.toml + rustc

      - name: Build (debug)
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

  release:
    # Это CD: только для тегов v*
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build               # сначала должны пройти тесты
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache Cargo (release)
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --verbose

      - name: Package as ZIP
        shell: pwsh
        run: |
          $exe = Get-ChildItem target\release\*.exe | Select-Object -First 1
          if (-not $exe) { throw "No .exe found in target/release" }
          $name = "${{ github.event.repository.name }}-${{ github.ref_name }}-windows-x64.zip"
          Compress-Archive -Path $exe.FullName -DestinationPath $name
          echo "ASSET_NAME=$name" >> $env:GITHUB_ENV

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
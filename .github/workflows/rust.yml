name: Rust Windows CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    # ИСПРАВЛЕНИЕ: Меняем операционную систему сервера сборки на Windows
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    # Полезное улучшение: кэширование зависимостей Cargo.
    # С ним последующие сборки на GitHub будут идти в 3-5 раз быстрее!
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2

     Sir, для eframe/egui на Windows не нужны сторонние C-библиотеки,
     поэтому обычныйcargo build отработает идеально.
    - name: Build
      run: cargo build --verbose

    - name: Run tests
      run: cargo test --verbose
